<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tickets - Cupissa</title>
    <!-- Fuentes para diseño aesthetic y ticket -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Librería para convertir el HTML del ticket a Imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #d81b60;
            --primary-hover: #b0154e;
            --bg-color: #f7f7f8;
            --ticket-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        /* Panel de Control */
        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--text-main);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.82rem;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-weight: 600;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .row {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 11px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-bottom: 10px;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-whatsapp:hover {
            background-color: #1ebd57;
        }
        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover {
            background-color: #fff0f5;
        }
        .divider {
            border-top: 1px dashed var(--border-color);
            margin: 15px 0;
        }

        /* Lista de productos para edición rápida */
        .items-edit-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            max-height: 220px;
            overflow-y: auto;
        }
        .item-edit-row {
            display: flex;
            gap: 6px;
            align-items: center;
            background: #fafafa;
            padding: 6px;
            border: 1px solid #eee;
            border-radius: 6px;
        }
        .item-edit-row input.edit-qty {
            width: 50px;
        }
        .item-edit-row input.edit-desc {
            flex: 1;
        }
        .item-edit-row input.edit-price {
            width: 75px;
        }
        .btn-del {
            background: #ff4d4f;
            color: white;
            border: none;
            border-radius: 4px;
            width: 28px;
            height: 32px;
            padding: 0;
            margin: 0;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-del:hover {
            background: #d9363e;
        }

        /* Diseño Aesthetic del Ticket */
        .ticket-container {
            background: var(--ticket-bg);
            width: 320px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            font-family: 'Courier Prime', monospace;
            color: var(--text-main);
            /* Borde superior dentado */
            background-image: radial-gradient(circle at 10px 0, transparent 10px, var(--ticket-bg) 11px);
            background-size: 20px 20px;
            background-position: -10px -10px;
            background-repeat: repeat-x;
        }
        .ticket-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;
            /* Borde inferior dentado */
            background-image: radial-gradient(circle at 10px 20px, transparent 10px, var(--ticket-bg) 11px);
            background-size: 20px 20px;
            background-position: -10px 10px;
            background-repeat: repeat-x;
        }
        .ticket-header {
            text-align: center;
            margin-bottom: 15px;
        }
        .ticket-header img {
            max-width: 150px;
            height: auto;
            margin-bottom: 8px;
        }
        .ticket-header p {
            margin: 2px 0;
            font-size: 0.85rem;
        }
        .client-info {
            font-size: 0.88rem;
            margin-bottom: 10px;
            word-break: break-word;
        }
        .items-table {
            width: 100%;
            font-size: 0.85rem;
            border-collapse: collapse;
        }
        .items-table th, .items-table td {
            text-align: left;
            padding: 4px 0;
            vertical-align: top;
        }
        .items-table th:last-child, .items-table td:last-child {
            text-align: right;
        }
        .totals {
            margin-top: 10px;
            font-size: 0.88rem;
        }
        .totals-row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }
        .totals-row.main-total {
            font-size: 1.05rem;
            font-weight: bold;
        }
        .payment-info {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 15px;
            line-height: 1.4;
        }
        .qr-code {
            text-align: center;
            margin-top: 12px;
        }
        .qr-code img {
            width: 110px;
            height: 110px;
            border-radius: 6px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Panel de Control -->
    <div class="control-panel">
        <h2>Generar / Editar Pedido</h2>
        
        <div class="form-group">
            <label>Nombre del Cliente (Opcional)</label>
            <input type="text" id="clientName" placeholder="Ej. María Pérez" oninput="updateTicket()">
        </div>
        
        <div class="divider"></div>
        
        <!-- Formulario para Añadir Producto -->
        <label style="color: var(--primary);">+ Agregar Nuevo Producto</label>
        <div class="form-group">
            <input type="text" id="prodDesc" placeholder="Descripción del producto">
        </div>
        <div class="row">
            <div class="form-group" style="flex: 1;">
                <label>Cant.</label>
                <input type="number" id="prodQty" value="1" min="1">
            </div>
            <div class="form-group" style="flex: 2;">
                <label>Precio Unit. ($)</label>
                <input type="number" id="prodPrice" step="0.01" placeholder="0.00">
            </div>
        </div>
        <button class="btn-outline" onclick="addItem()">+ Añadir al Ticket</button>
        
        <!-- Lista de Productos Añadidos (Edición Directa) -->
        <div id="addedItemsSection" style="display: none; margin-top: 10px;">
            <label>Productos en el Ticket (Edita directo aquí):</label>
            <div class="items-edit-list" id="addedItemsList"></div>
        </div>

        <div class="divider"></div>
        
        <!-- Sección de Abonos y Tasa -->
        <div class="row">
            <div class="form-group" style="flex: 1;">
                <label>Abono / Pago Parcial ($)</label>
                <input type="number" id="depositAmount" step="0.01" value="0" placeholder="0.00" oninput="updateTicket()">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Tasa (Bs por $1)</label>
                <input type="number" id="exchangeRate" value="1000" oninput="updateTicket()">
            </div>
        </div>
        
        <div class="divider"></div>

        <button onclick="downloadTicket()">1. Descargar Ticket (Imagen)</button>
        <button class="btn-whatsapp" onclick="sendWhatsApp()">2. Enviar por WhatsApp</button>
        <p style="font-size: 0.75rem; color: #777; text-align: center; margin-top: -5px;">Nota: WhatsApp abrirá el mensaje de texto. Recuerda adjuntar la imagen descargada en el chat.</p>
        <button class="btn-outline" style="border: none; color: #888;" onclick="resetTicket()">Limpiar Todo</button>
    </div>

    <!-- Previsualización del Ticket -->
    <div class="ticket-container" id="ticketDOM">
        <div class="ticket-header">
            <img src="cupissa (500 x 100 px).png" alt="Cupissa Logo">
            <p>PEDIDO CONFIRMADO</p>
            <p id="ticketDate"></p>
        </div>
        
        <div class="client-info" id="ticketClientBox" style="display: none;">
            Cliente: <span id="ticketClientName"></span>
        </div>
        
        <div class="divider"></div>
        
        <table class="items-table">
            <thead>
                <tr>
                    <th style="width: 15%">Cant</th>
                    <th style="width: 55%">Descripción</th>
                    <th style="width: 30%">Total</th>
                </tr>
            </thead>
            <tbody id="ticketItemsBody">
                <!-- Los items aparecerán aquí -->
            </tbody>
        </table>
        
        <div class="divider"></div>
        
        <!-- Contenedor Dinámico de Totales / Abonos -->
        <div class="totals" id="ticketTotals">
            <!-- Se actualiza por JS -->
        </div>
        
        <div class="divider"></div>
        
        <div class="payment-info">
            <strong>DATOS PARA PAGO MÓVIL</strong><br>
            Banco Fondo Común (BFC)<br>
            Cuenta Corriente<br>
            V-37.830.901<br>
            Celular: 0424-2897281
        </div>
        
        <div class="qr-code">
            <img src="qr.jpeg" alt="QR Pago Movil">
        </div>
        
        <div style="text-align: center; margin-top: 15px; font-size: 0.8rem;">
            ¡Gracias por tu compra!
        </div>
    </div>

    <script>
        let items = [];

        // Inicializar fecha actual
        document.getElementById('ticketDate').innerText = new Date().toLocaleDateString('es-ES', { 
            year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        });

        function addItem() {
            const desc = document.getElementById('prodDesc').value.trim();
            const qty = parseFloat(document.getElementById('prodQty').value);
            const price = parseFloat(document.getElementById('prodPrice').value);

            if (!desc || isNaN(qty) || isNaN(price)) {
                alert("Por favor, ingresa una descripción, cantidad y precio válidos.");
                return;
            }

            items.push({
                id: Date.now(),
                desc: desc,
                qty: qty,
                price: price
            });
            
            // Limpiar formulario de entrada
            document.getElementById('prodDesc').value = '';
            document.getElementById('prodQty').value = '1';
            document.getElementById('prodPrice').value = '';
            
            renderEditList();
            updateTicket();
        }

        function updateItem(id, field, value) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            if (field === 'desc') {
                item.desc = value;
            } else if (field === 'qty') {
                item.qty = parseFloat(value) || 0;
            } else if (field === 'price') {
                item.price = parseFloat(value) || 0;
            }

            updateTicket();
        }

        function removeItem(id) {
            items = items.filter(i => i.id !== id);
            renderEditList();
            updateTicket();
        }

        function renderEditList() {
            const container = document.getElementById('addedItemsList');
            const section = document.getElementById('addedItemsSection');
            container.innerHTML = '';

            if (items.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-edit-row';
                row.innerHTML = `
                    <input type="number" class="edit-qty" value="${item.qty}" min="1" oninput="updateItem(${item.id}, 'qty', this.value)">
                    <input type="text" class="edit-desc" value="${item.desc}" oninput="updateItem(${item.id}, 'desc', this.value)">
                    <input type="number" step="0.01" class="edit-price" value="${item.price}" oninput="updateItem(${item.id}, 'price', this.value)">
                    <button class="btn-del" onclick="removeItem(${item.id})">✕</button>
                `;
                container.appendChild(row);
            });
        }

        function updateTicket() {
            // 1. Cliente
            const clientName = document.getElementById('clientName').value;
            const clientBox = document.getElementById('ticketClientBox');
            if (clientName.trim() !== "") {
                document.getElementById('ticketClientName').innerText = clientName;
                clientBox.style.display = "block";
            } else {
                clientBox.style.display = "none";
            }

            // 2. Tabla de Items en el Ticket
            const tbody = document.getElementById('ticketItemsBody');
            tbody.innerHTML = '';
            let totalUSD = 0;

            items.forEach(item => {
                const itemTotal = item.qty * item.price;
                totalUSD += itemTotal;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.qty}x</td>
                    <td>${item.desc}</td>
                    <td>$${itemTotal.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            // 3. Totales, Abonos y Tasa
            const rate = parseFloat(document.getElementById('exchangeRate').value) || 1000;
            const depositUSD = parseFloat(document.getElementById('depositAmount').value) || 0;

            const totalBs = totalUSD * rate;
            const depositBs = depositUSD * rate;

            let balanceUSD = totalUSD - depositUSD;
            if (balanceUSD < 0) balanceUSD = 0;
            const balanceBs = balanceUSD * rate;

            const totalsDiv = document.getElementById('ticketTotals');

            if (depositUSD > 0) {
                totalsDiv.innerHTML = `
                    <div class="totals-row">
                        <span>Total Pedido:</span>
                        <span>$${totalUSD.toFixed(2)} (${formatBs(totalBs)})</span>
                    </div>
                    <div class="totals-row" style="color: #2e7d32;">
                        <span>Abonado:</span>
                        <span>-$${depositUSD.toFixed(2)} (${formatBs(depositBs)})</span>
                    </div>
                    <div class="totals-row main-total" style="margin-top: 6px; border-top: 1px dashed #bbb; padding-top: 6px; color: var(--primary);">
                        <span>RESTA POR PAGAR:</span>
                        <span>$${balanceUSD.toFixed(2)}</span>
                    </div>
                    <div class="totals-row main-total" style="font-size: 0.95rem; color: var(--primary);">
                        <span>EN SOBERANOS:</span>
                        <span>${formatBs(balanceBs)}</span>
                    </div>
                `;
            } else {
                totalsDiv.innerHTML = `
                    <div class="totals-row main-total">
                        <span>TOTAL USD:</span>
                        <span>$${totalUSD.toFixed(2)}</span>
                    </div>
                    <div class="totals-row main-total" style="font-size: 0.95rem;">
                        <span>TOTAL BS:</span>
                        <span>${formatBs(totalBs)}</span>
                    </div>
                `;
            }
        }

        function formatBs(val) {
            return `Bs ${val.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        function resetTicket() {
            items = [];
            document.getElementById('clientName').value = '';
            document.getElementById('depositAmount').value = '0';
            document.getElementById('exchangeRate').value = '1000';
            renderEditList();
            updateTicket();
        }

        function downloadTicket() {
            const ticketElement = document.getElementById('ticketDOM');
            html2canvas(ticketElement, { scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Ticket_Cupissa_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function sendWhatsApp() {
            const clientName = document.getElementById('clientName').value;
            const depositUSD = parseFloat(document.getElementById('depositAmount').value) || 0;
            const rate = parseFloat(document.getElementById('exchangeRate').value) || 1000;

            let totalUSD = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
            let totalBs = totalUSD * rate;
            let depositBs = depositUSD * rate;
            let balanceUSD = Math.max(0, totalUSD - depositUSD);
            let balanceBs = balanceUSD * rate;

            let message = `¡Hola${clientName ? ' ' + clientName : ''}! Aquí tienes el resumen de tu pedido en Cupissa.\n\n`;
            message += `*Total Pedido:* $${totalUSD.toFixed(2)} (${formatBs(totalBs)})\n`;

            if (depositUSD > 0) {
                message += `*Abonado:* $${depositUSD.toFixed(2)} (${formatBs(depositBs)})\n`;
                message += `*Resta por Pagar:* $${balanceUSD.toFixed(2)} (${formatBs(balanceBs)})\n`;
            }

            message += `\nTe adjunto la imagen del ticket con los datos de pago a continuación.`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
